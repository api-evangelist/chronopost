    name: WSDL (provider-hosted)
    url: https://ws.chronopost.fr/shipping-cxf/ShippingServiceWS?wsdl
- aid: chronopost:tracking
  name: Chronopost Tracking Web Service
  description: SOAP web service. Tracks skybills by number or sender reference, searches proof of delivery, and cancels skybills.
    9 operations in the published WSDL.
  humanURL: https://ws.chronopost.fr/tracking-cxf/TrackingServiceWS?wsdl
