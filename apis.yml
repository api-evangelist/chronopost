- aid: chronopost:shipping
  name: Chronopost Shipping Web Service
  description: SOAP web service. Creates shipments and skybills (labels), single and multi-parcel, with reservation and ESD
    (pickup) variants, routing and pickup booking/cancellation. 38 operations in the published WSDL.
  humanURL: https://ws.chronopost.fr/shipping-cxf/ShippingServiceWS?wsdl
