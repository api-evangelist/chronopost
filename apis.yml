aid: chronopost
name: Chronopost
description: 'Chronopost is the French express parcel and courier carrier of the La Poste group (DPDgroup), delivering business
  and consumer parcels across France, its overseas departments and internationally, with Pickup relay points and Shop2Shop.
  For business customers it publishes public SOAP web services at ws.chronopost.fr, each with a live WSDL: Shipping (label/skybill
  creation and pickup booking, 38 operations), Tracking (tracking, proof of delivery and cancellation, 9), QuickCost (pricing
  and delivery-time quotes, 6), PointRelais (relay point and agency search, 19) and Creneau (delivery-slot appointment booking,
  4). Calls require a Chronopost customer account number and password.'
